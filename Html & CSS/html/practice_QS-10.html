 <body><!-- Recreate the following table using HTML : -->
    <table border="1px solid black">
        <caption> Students Information</caption>
        <tr>
            <th rowspan="6">Info</th>
            <th rowspan="2">Name</th>
            <th colspan="2">Address</th>
        </tr>
        <tr>
            <td>City</td>
            <td>House</td>
        </tr>
        <tr>
            <td>A</td>
            <td>Bihar</td>
            <td>1</td>
        </tr>
        <tr>
            <td>B</td>
            <td>Delhi</td>
            <td>2</td>
        </tr>
        <tr>
            <td>C</td>
            <td>Mumbai</td>
            <td>3</td>
        </tr>
        <tr>
            <td>D</td>
            <td>Chennai</td>
            <td>4</td>
        </tr>
    </table>
    <hr> <hr> <hr>
    <Form>
        <label for="Name"> Name :</label>
        <input type="text" id="Name" placeholder="Enter your Name"><br>
        <label for="sex">Sex :</label>
        <input type="radio" id="sex" name="Sex" value="MAle"> Male
        <input type="radio" id="sex" name="sex" value=" Female"> female<br>
        <label for="country"> Country : </label>
        <Select name="country" id="country">
            <option value="india" selected>India</option>
            <option value="USA">USA</option>
            <option value="Aus">Aus</option>
            <option value="can">Can</option>
            <option value="UK">Uk</option>
        </Select> <br>
        <label for="msg">Massage :</label>
        <textarea id="msg" cols="30" rows="5" placeholder="Enter your Massage"></textarea><br>
    
    </Form>
